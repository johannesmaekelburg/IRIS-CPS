# Default configuration for the GINE-based inconsistency surrogate.
#
# Override any field by copying this file and modifying values.
# Missing fields fall back to dataclass defaults in config.py.

data_root: "data/surrogate"
output_dir: "results/surrogate"

# --- Pretraining (self-supervised, scenario-independent) ---
pretrain:
  enabled: true
  tasks:                    # subset of: [volume, containment, pairwise_aabb, affine_map]
    - volume
    - containment
    - pairwise_aabb
    - affine_map
  epochs: 500
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-5
  scheduler: step           # cosine | step | none
  loss_weights:
    volume: 1.0
    containment: 1.0
    pairwise_aabb: 1.0
    affine_map: 1.0
  val_fraction: 0.1
  patience: 100             # early stopping (0 = disabled)

# --- Fine-tuning (supervised inconsistency regression) ---
train:
  scenarios_train: [1,2,3,4,6,7,8,9,11,12,13,14,15,16,17,19,20,21,23,24,25,26,28,29,30,32,33,34,35,37,38,39,41,42,43,45,46,47]
  scenarios_test: [5,10,18,22,27,31,36,40,44,48]  # held-out for generalization eval (stratified 80/20)
  val_fraction: 0.15
  epochs: 400
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: step
  loss: huber               # mse | huber
  huber_delta: 0.05
  patience: 1500000
  freeze_backbone_epochs: 10 # freeze encoder+GINE for first N epochs (0 = never)
  backbone_lr_factor: 0.1   # backbone LR = lr * this factor
  auxiliary_aabb_weight: 0.0 # weight for auxiliary I_aabb loss (0 = disabled)

# --- Model architecture ---
model:
  d_max: 4
  p_max: 12
  # Zonotope encoder
  center_mlp_dims: [4, 16]
  generator_mlp_dims: [4, 16, 16]
  generator_pool: sum       # sum | mean
  node_embed_dim: 64
  # Edge encoder (UPR: F flattened 4x4=16 + f 4 = 20)
  edge_input_dim: 20
  edge_mlp_dims: [20, 64, 64]
  # GINE backbone
  n_gine_layers: 3
  gine_hidden_dim: 64
  gine_mlp_layers: 2
  dropout: 0.1
  batch_norm: true
  # Readout + prediction head
  readout: mean             # mean | sum
  head_mlp_dims: [64, 32, 1]

seed: 42
device: auto                # auto | cpu | cuda:0
num_workers: 4
