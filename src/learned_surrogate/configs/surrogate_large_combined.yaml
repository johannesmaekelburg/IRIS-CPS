# Large model (64 dim, 3 layers) + combined loss (Huber + MSE)
# Combines the architecture from surrogate_default.yaml (current run)
# with the combined loss from surrogate_combined_loss.yaml.

data_root: "data/surrogate"
output_dir: "results/surrogate"

# --- Pretraining ---
pretrain:
  enabled: true
  tasks:
    - volume
    - containment
    - pairwise_aabb
    - affine_map
  epochs: 500
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-5
  scheduler: step
  loss_weights:
    volume: 1.0
    containment: 1.0
    pairwise_aabb: 1.0
    affine_map: 1.0
  val_fraction: 0.1
  patience: 100

# --- Fine-tuning ---
train:
  scenarios_train: [1,2,3,4,6,7,8,9,11,12,13,14,15,16,17,19,20,21,23,24,25,26,28,29,30,32,33,34,35,37,38,39,41,42,43,45,46,47]
  scenarios_test: [5,10,18,22,27,31,36,40,44,48]
  val_fraction: 0.15
  epochs: 400
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: step
  loss: combined             # huber + mse weighted sum
  huber_delta: 0.05
  mse_weight: 0.5            # loss = 0.5 * Huber + 0.5 * MSE
  patience: 1500000
  freeze_backbone_epochs: 10
  backbone_lr_factor: 0.1
  auxiliary_aabb_weight: 0.0

# --- Model architecture (large) ---
model:
  d_max: 4
  p_max: 12
  center_mlp_dims: [4, 16]
  generator_mlp_dims: [4, 16, 16]
  generator_pool: sum
  node_embed_dim: 64
  edge_input_dim: 20
  edge_mlp_dims: [20, 64, 64]
  n_gine_layers: 3
  gine_hidden_dim: 64
  gine_mlp_layers: 2
  dropout: 0.1
  batch_norm: true
  readout: mean
  head_mlp_dims: [64, 32, 1]

seed: 42
device: auto
num_workers: 4
